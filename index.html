<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="cozy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#141414">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="saves — a private, local-first cinema for your bookmarks.">
  <meta name="robots" content="noindex, nofollow">
  <title>saves</title>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob: https://pbs.twimg.com https://video.twimg.com https://abs.twimg.com https://i.redd.it https://preview.redd.it https://external-preview.redd.it https://b.thumbs.redditmedia.com https://a.thumbs.redditmedia.com; media-src 'self' file: data: blob: https://video.twimg.com https://pbs.twimg.com https://commondatastorage.googleapis.com https://v.redd.it; connect-src 'self' https://video.twimg.com https://pbs.twimg.com https://commondatastorage.googleapis.com https://v.redd.it; worker-src blob:; font-src 'self' data:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="preload" href="styles/fonts/bebas-neue.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="styles/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101012'/%3E%3Cpath d='M20 14 H44 V46 L32 37 L20 46 Z' fill='%23e50914'/%3E%3C/svg%3E">

  <!-- defence in depth: scripts only from this folder, media/images only from X's CDN (+ local files, blob/data for players) -->

  <!-- everything else (stylesheets + scripts, in order) comes from src/manifest.js -->
  <script src="src/manifest.js"></script>
  <script src="src/kernel/loader.js"></script>

  <!-- Paint before a single module executes. The splash lives in the markup (not in JS), so the
       first frame is the app's own background instead of white — the perceived start is now the
       HTML response, not the end of a ~1 MB script chain. shell.splash takes the node over. -->
  <style>
    html { background: #0a0a0b; color-scheme: dark; }
    html[data-theme="light"] { background: #f6f6f7; }
    #boot-splash { position: fixed; inset: 0; display: grid; place-items: center; background: inherit;
      transition: opacity .24s ease; z-index: 9999; }
    #boot-splash.is-done { opacity: 0; pointer-events: none; }
    #boot-splash .bs-mark { width: 44px; height: 44px; opacity: .9; animation: bs-pulse 1.6s ease-in-out infinite; }
    #boot-splash .bs-label { margin-top: 14px; font: 500 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: .14em; text-transform: uppercase; color: #7c7c80; }
    #boot-splash .bs-wrap { display: grid; justify-items: center; }
    @keyframes bs-pulse { 0%,100% { opacity: .35; transform: scale(.97); } 50% { opacity: .95; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { #boot-splash .bs-mark { animation: none; opacity: .8; } }
  </style>
</head>
<body>
  <noscript><p style="font:16px system-ui;padding:2rem">saves needs JavaScript. Everything runs locally in your browser.</p></noscript>
  <div id="boot-splash" aria-hidden="true">
    <div class="bs-wrap">
      <svg class="bs-mark" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#141416"/><path d="M20 14 H44 V46 L32 37 L20 46 Z" fill="#e50914"/></svg>
      <p class="bs-label">Opening your library</p>
    </div>
  </div>
  <div id="app"></div>
</body>
</html>
