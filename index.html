<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="cozy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#141414">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="saves — a private, local-first cinema for your bookmarks.">
  <meta name="robots" content="noindex, nofollow">
  <title>saves</title>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob: https://pbs.twimg.com https://video.twimg.com https://abs.twimg.com; media-src 'self' file: data: blob: https://video.twimg.com https://pbs.twimg.com https://commondatastorage.googleapis.com; connect-src 'self' https://video.twimg.com https://pbs.twimg.com https://commondatastorage.googleapis.com; worker-src blob:; font-src 'self' data:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="preload" href="styles/fonts/bebas-neue.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="styles/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101012'/%3E%3Cpath d='M20 14 H44 V46 L32 37 L20 46 Z' fill='%23e50914'/%3E%3C/svg%3E">

  <!-- defence in depth: scripts only from this folder, media/images only from X's CDN (+ local files, blob/data for players) -->

  <!-- everything else (stylesheets + scripts, in order) comes from src/manifest.js -->
  <script src="src/manifest.js"></script>
  <script src="src/kernel/loader.js"></script>
</head>
<body>
  <noscript><p style="font:16px system-ui;padding:2rem">saves needs JavaScript. Everything runs locally in your browser.</p></noscript>
  <div id="app"></div>
</body>
</html>
