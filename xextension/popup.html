<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Capture · X Bookmarks</title>
<link rel="stylesheet" href="m3e/fonts.css" />
<link rel="stylesheet" href="m3e/tokens.css" />
<link rel="stylesheet" href="m3e/components.css" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>

<div class="popup">

  <!-- =======================================================================
       Header — identity and the single most important fact: are we running?
       ======================================================================= -->
  <header class="popup__head">
    <span class="popup__mark m3e-state" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M6 2h12a2 2 0 0 1 2 2v17.2a.8.8 0 0 1-1.2.7L12 18l-6.8 3.9A.8.8 0 0 1 4 21.2V4a2 2 0 0 1 2-2Z"/>
      </svg>
    </span>
    <div class="popup__head-text">
      <h1 class="m3e-title-medium m3e-title-medium--emphasized">Capture</h1>
      <p class="m3e-body-small popup__subtitle" id="tabHint">Checking this tab…</p>
    </div>
    <button class="m3e-icon-button m3e-icon-button--s m3e-state" id="themeToggle" aria-label="Switch color scheme" title="Switch color scheme (current: system)">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      </svg>
    </button>
  </header>

  <!-- =======================================================================
       Status card — the hero of this surface.
       Status is carried by THREE redundant channels: a coloured container,
       an icon, and a word. Never colour alone.
       ======================================================================= -->
  <section class="status m3e-state" id="statusCard" data-status="idle" aria-labelledby="statusLabel">
    <div class="status__row">
      <span class="status__dot" id="statusDot" aria-hidden="true"></span>
      <div class="status__text">
        <p class="m3e-title-medium m3e-title-medium--emphasized status__label" id="statusLabel">Idle</p>
        <p class="m3e-body-small status__detail" id="statusDetail">No capture run yet.</p>
      </div>
    </div>

    <!-- Wavy progress: the M3 Expressive indicator for indeterminate,
         long-running work. Hidden entirely when not capturing. -->
    <div class="status__progress" id="progressHost" hidden>
      <div class="m3e-progress m3e-progress--wavy" role="progressbar"
        aria-label="Capture in progress" aria-valuetext="Capturing">
        <svg class="m3e-progress__wave" aria-hidden="true">
          <defs>
            <pattern id="m3e-wave" width="32" height="10" patternUnits="userSpaceOnUse">
              <path d="M-32 5 Q-24 1 -16 5 T0 5 T16 5 T32 5 T48 5 T64 5"
                fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            </pattern>
          </defs>
          <rect class="m3e-progress__wave-fill"
            x="-32" y="0" width="calc(100% + 64px)" height="10" fill="url(#m3e-wave)" />
        </svg>
      </div>
    </div>
  </section>

  <!-- =======================================================================
       Live counters

       "Media" replaces the old duplicate count. The dashboard this feeds is a
       media browser, so the number that tells you the run is working is how
       many photos and videos came back — a capture that finds 400 posts and
       zero media has failed in a way a post count cannot show. Duplicates are
       scraper diagnostics and moved to the activity log.
       ======================================================================= -->
  <dl class="stats" id="stats">
    <div class="stat stat--captured m3e-state">
      <dt class="m3e-label-small">Posts</dt>
      <dd class="m3e-headline-small m3e-headline-small--emphasized m3e-tabular" id="statCaptured">0</dd>
    </div>
    <div class="stat stat--new m3e-state">
      <dt class="m3e-label-small">New</dt>
      <dd class="m3e-headline-small m3e-headline-small--emphasized m3e-tabular" id="statNew">0</dd>
    </div>
    <div class="stat stat--media m3e-state">
      <dt class="m3e-label-small">Media</dt>
      <dd class="m3e-headline-small m3e-headline-small--emphasized m3e-tabular" id="statMedia">0</dd>
    </div>
    <div class="stat stat--failed m3e-state">
      <dt class="m3e-label-small">Failed</dt>
      <dd class="m3e-headline-small m3e-headline-small--emphasized m3e-tabular" id="statFailed">0</dd>
    </div>
  </dl>
  <p class="m3e-body-small stats__hint" id="mediaHint">No photos or video yet</p>

  <!-- =======================================================================
       Transport controls
       One filled primary action. Everything else is subordinate — the M3 rule
       of a single filled button per view, applied literally.
       ======================================================================= -->
  <div class="controls">
    <button class="m3e-button m3e-button--filled m3e-button--m m3e-button--block m3e-state" id="primaryBtn">
      <span id="primaryIcon" class="m3e-button__icon">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      </span>
      <span id="primaryLabel">Start capture</span>
      <span class="m3e-button__loader" aria-hidden="true"></span>
    </button>

    <div class="m3e-button-group controls__group" role="group" aria-label="Capture controls">
      <button class="m3e-button m3e-button--tonal m3e-state" id="pauseBtn" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="4" width="4" height="16" />
          <rect x="14" y="4" width="4" height="16" />
        </svg>
        <span>Pause</span>
      </button>
      <button class="m3e-button m3e-button--tonal m3e-state" id="stopBtn" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" />
        </svg>
        <span>Stop</span>
      </button>
    </div>

    <!-- Panic is a destructive escape hatch: abort now, don't flush. It gets
         the error role and the lowest emphasis so it can never be hit by
         accident, but it is always one click away while a run is live. -->
    <button class="m3e-button m3e-button--text m3e-button--xs m3e-state controls__panic"
      id="panicBtn" disabled>Panic stop — abort without saving</button>
  </div>

  <!-- =======================================================================
       Export
       ======================================================================= -->
  <section class="export" aria-labelledby="exportLabel">
    <h2 class="m3e-label-medium section-label" id="exportLabel">Export</h2>
    <div class="export__row">
      <button class="m3e-button m3e-button--tonal m3e-state export__btn" id="exportJson" title="Full export (all captured posts)">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
          <polyline points="10 9 9 9 8 9" />
        </svg>
        <span>JSON</span>
      </button>
      <button class="m3e-button m3e-button--outlined m3e-state export__btn" id="exportJsonl" title="JSON Lines (streaming)">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
          <line x1="10" y1="9" x2="8" y2="9" />
        </svg>
        <span>JSONL</span>
      </button>
      <button class="m3e-button m3e-button--outlined m3e-state export__btn" id="exportCsv" title="CSV (Excel-friendly)">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <line x1="9" y1="3" x2="9" y2="21" />
          <line x1="15" y1="3" x2="15" y2="21" />
          <line x1="3" y1="9" x2="21" y2="9" />
          <line x1="3" y1="15" x2="21" y2="15" />
        </svg>
        <span>CSV</span>
      </button>
    </div>
    <div class="export__row">
      <div class="export__overflow">
        <button class="m3e-button m3e-button--outlined m3e-state export__btn export__overflow-trigger" id="exportMore" aria-haspopup="true" aria-expanded="false" title="More export formats">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1" />
            <circle cx="12" cy="5" r="1" />
            <circle cx="12" cy="19" r="1" />
          </svg>
          <span>More</span>
        </button>
        <div class="export__overflow-menu" id="exportOverflowMenu" role="menu" aria-label="Additional export formats">
          <button class="m3e-button m3e-button--outlined m3e-state export__btn" id="exportMd" role="menuitem" title="Markdown (Obsidian/Notion)">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="8" y1="13" x2="16" y2="13" />
              <line x1="8" y1="17" x2="16" y2="17" />
              <line x1="12" y1="10" x2="12" y2="20" />
            </svg>
            <span>MD</span>
          </button>
          <button class="m3e-button m3e-button--outlined m3e-state export__btn" id="exportHtml" role="menuitem" title="HTML (offline gallery)">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="8" y1="13" x2="16" y2="13" />
              <line x1="12" y1="10" x2="12" y2="17" />
              <line x1="8" y1="17" x2="16" y2="17" />
            </svg>
            <span>HTML</span>
          </button>
        </div>
      </div>
    </div>
    <p class="m3e-body-small export__hint" id="exportHint">Nothing captured yet.</p>

    <!-- Opens the dashboard as an extension page, where it can read captured
         posts directly instead of requiring an export/import round trip. -->
    <button class="m3e-button m3e-button--filled m3e-state export__open" id="openDashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" />
        <rect x="14" y="3" width="7" height="7" />
        <rect x="14" y="14" width="7" height="7" />
        <rect x="3" y="14" width="7" height="7" />
      </svg>
      <span>Open library</span>
    </button>
  </section>

  <!-- =======================================================================
       Activity log — collapsed by default; detail on demand
       ======================================================================= -->
  <details class="log" id="logPanel">
    <summary class="log__summary m3e-state">
      <svg class="log__chevron" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6" />
      </svg>
      <span class="m3e-label-large">Activity</span>
      <span class="m3e-chip__badge m3e-tabular" id="logCount">0</span>
    </summary>
    <ol class="log__list" id="log" aria-live="polite" aria-relevant="additions"></ol>
  </details>

  <!-- =======================================================================
       Footer
       ======================================================================= -->
  <footer class="popup__foot">
    <span class="version-badge" id="versionBadge">v1.0.0 · M3E</span>
    <button class="m3e-button m3e-button--text m3e-button--xs m3e-state" id="resetBtn">Clear captured data</button>
  </footer>
</div>

<!-- Confirm dialog + scrim -->
<div class="m3e-scrim" id="scrim" data-open="false"></div>
<div class="m3e-dialog dialog" id="dialog" role="dialog" aria-modal="true"
  aria-labelledby="dialogTitle" aria-hidden="true" data-open="false">
  <div class="m3e-dialog__header">
    <h2 class="m3e-title-large m3e-title-large--emphasized m3e-dialog__title" id="dialogTitle"></h2>
  </div>
  <div class="m3e-dialog__content" id="dialogContent"></div>
  <div class="m3e-dialog__actions" id="dialogActions"></div>
</div>

<div class="m3e-snackbar" id="snackbar" role="status" aria-live="polite" data-open="false">
  <span class="m3e-snackbar__text"></span>
  <button class="m3e-snackbar__action" hidden></button>
</div>

<script src="m3e/color.js"></script>
<script src="m3e/theme.js"></script>
<script src="m3e/interactions.js"></script>
<script src="popup.js"></script>
</body>
</html>
